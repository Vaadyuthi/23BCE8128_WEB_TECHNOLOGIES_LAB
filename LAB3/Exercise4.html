<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Matrix Activity Sentinel</title>
    <style>
         :root {
            --neon-green: #6e97c4;
            --matrix-dark: pastel yellow;
            --border-color: #222;
            --warning-red: #ff3e3e;
        }
        
        body {
            background-color: var(--matrix-dark);
            color: var(--neon-green);
            font-family: 'Consolas', 'Monaco', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .monitor-panel {
            width: 80%;
            max-width: 800px;
            height: 80vh;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--neon-green);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        #log-area {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            background: #000;
            border: 1px solid var(--border-color);
        }
        
        .log-entry {
            font-size: 0.9rem;
            margin-bottom: 5px;
            border-left: 2px solid var(--neon-green);
            padding-left: 10px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
        }
        
        button {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 10px var(--neon-green);
        }
        
        #alert-banner {
            background: var(--warning-red);
            color: white;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            50% {
                opacity: 0.5;
            }
        }
        
        .test-input {
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="monitor-panel">
        <div class="header">
            <span>[ STATUS: MONITORING ACTIVE ]</span>
            <input type="text" class="test-input" placeholder="Click here to test Focus">
        </div>

        <div id="alert-banner">SECURITY BREACH: SUSPICIOUS ACTIVITY DETECTED</div>

        <div id="log-area"></div>

        <div class="btn-group">
            <button onclick="resetLogs()">Reset Terminal</button>
            <button onclick="exportLogs()">Export Data</button>
        </div>
    </div>

    <script>
        const activityLog = [];
        const logArea = document.getElementById('log-area');
        let clickCounter = 0;

        window.addEventListener('click', (e) => {
            logActivity('MOUSE_CLICK', `X: ${e.clientX}, Y: ${e.clientY} | Target: ${e.target.tagName}`);
            handleSuspiciousActivity();
        });

        window.addEventListener('keydown', (e) => {
            logActivity('KEY_PRESS', `Key: ${e.key} | Code: ${e.code}`);
        });

        window.addEventListener('focus', (e) => {
            logActivity('FOCUS_GAIN', `Element: ${e.target.tagName} ${e.target.className || ''}`);
        }, true);

        function logActivity(event, details) {
            const entry = {
                type: event,
                info: details,
                timestamp: new Date().toLocaleTimeString()
            };
            activityLog.push(entry);

            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `> [${entry.timestamp}] <span style="color:#fff">${entry.type}</span> :: ${entry.info}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function handleSuspiciousActivity() {
            clickCounter++;
            if (clickCounter > 5) {
                document.getElementById('alert-banner').style.display = 'block';
            }

            setTimeout(() => {
                clickCounter--;
                if (clickCounter <= 5) document.getElementById('alert-banner').style.display = 'none';
            }, 2000);
        }

        function resetLogs() {
            activityLog.length = 0;
            logArea.innerHTML = '';
            document.getElementById('alert-banner').style.display = 'none';
        }

        function exportLogs() {
            if (activityLog.length === 0) return alert("No logs to export!");

            const formattedText = activityLog
                .map(log => `[${log.timestamp}] ${log.type}: ${log.info}`)
                .join('\n');

            const blob = new Blob([formattedText], {
                type: 'text/plain'
            });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'User_Activity_Log.txt';
            link.click();
        }
    </script>

</body>

</html>
